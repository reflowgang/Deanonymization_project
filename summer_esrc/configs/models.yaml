# Local vLLM tiers on gpu6.sedan.pro (OpenAI-compatible).
# Override via env: VLLM_BASE_URL, VLLM_EXTRACT_MODEL, VLLM_REASON_MODEL.
#
# Served context limits (do NOT mix these across tiers):
#   qwen3.5-4b              max_input=16384  max_output=8192   ← Extract only
#   qwen3.6-35b-a3b-nvfp4   max_input=32768  max_output=8192   ← Reason only
# Generation max_tokens defaults below are output budgets (≤1024), never the
# Extract context window (16384) — using ~16000 as max_tokens on Reason with a
# ~16k prompt overflows the 32k context (prompt+max_tokens check).

extract_tier:
  model: qwen3.5-4b
  temperature: 0.0
  max_tokens: 1024
  context_limit_tokens: 16384
  # Thinking not required for Extract; keep disabled for speed.
  enable_thinking: false

reason_tier:
  # LOCKED for P2 (2026-08-04): do not swap mid-experiment.
  model: qwen3.6-35b-a3b-nvfp4
  # Rejected alternative for this phase: gemma4-26b
  temperature: 0.0
  # Allow headroom if thinking slips through; prefer enable_thinking=false.
  max_tokens: 1024
  context_limit_tokens: 32768
  # Pass via generate(..., enable_thinking=False) →
  # extra_body.chat_template_kwargs.enable_thinking = false
  enable_thinking: false

embeddings:
  model: jina-embeddings-v3

reranker:
  model: jina-reranker-v2-base-multilingual

defaults:
  base_url_env: VLLM_BASE_URL
  api_key_env: VLLM_API_KEY
  api_key_default: "local-vllm"
  # Fixture / P2 defaults
  fixture_id: regression_50
  truncation_level: T8
  seed: 2026
